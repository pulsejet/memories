name: go-vod

on:
  workflow_dispatch:
  push:
    branches: [master]
    tags:
      - "go-vod/*"
    paths:
      - "go-vod/**"
      - ".github/workflows/go-vod.yml"
  pull_request:
    paths:
      - "go-vod/**"
      - ".github/workflows/go-vod.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  binary:
    name: Binary
    runs-on: ubuntu-latest

    container:
      image: golang:1.27-bookworm

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build
        working-directory: go-vod
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -buildvcs=false -ldflags="-s -w" -o go-vod-amd64
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -buildvcs=false -ldflags="-s -w" -o go-vod-aarch64

      - name: Test
        working-directory: go-vod
        run: go vet ./... && go test ./...

      - name: Upload to releases
        if: startsWith(github.ref, 'refs/tags/go-vod/')
        uses: svenstaro/upload-release-action@29e53e917877a24fad85510ded594ab3c9ca12de # v2
        id: attach_to_release
        with:
          file: go-vod/go-vod-*
          file_glob: true
          tag: ${{ github.ref }}
          release_name: ${{ github.ref_name }}
          overwrite: true
          make_latest: false

  docker:
    runs-on: ubuntu-latest
    name: Docker
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/go-vod/')

    steps:
      - name: Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to DockerHub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Get image label
        id: image_label
        run: echo "label=${GITHUB_SHA}" >> $GITHUB_OUTPUT

      - name: Build container image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          push: true
          platforms: linux/amd64,linux/arm64
          context: './go-vod/'
          no-cache: true
          file: './go-vod/Dockerfile'
          tags: radialapps/go-vod:${{ steps.image_label.outputs.label }} , radialapps/go-vod:latest
          provenance: false
