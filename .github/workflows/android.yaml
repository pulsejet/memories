---
name: android
on:
  push:
    branches: [master]
    paths:
      - 'android/**'
      - '.github/workflows/android.yaml'
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android.yaml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: ''

      - name: Install SDK packages
        run: |
          sdkmanager "platforms;android-37.2" "build-tools;36.0.0"

      - name: Build and lint
        working-directory: android
        run: ./gradlew assembleDebug assembleRelease lintRelease --console=plain

      - name: Upload release APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: android/app/build/outputs/apk/release/*.apk
          archive: false
          if-no-files-found: error

      - name: Upload debug APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: android/app/build/outputs/apk/debug/*.apk
          archive: false
          if-no-files-found: error
