---
name: android
on:
  push:
    branches: [master, development]
    paths:
      - 'android/**'
      - '.github/workflows/android.yaml'
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android.yaml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: ''

      - name: Install SDK packages
        run: |
          sdkmanager "platforms;android-37.2" "build-tools;36.0.0"

      - name: Build and lint
        working-directory: android
        run: ./gradlew assembleDebug assembleRelease lintRelease --console=plain
