name: e2e

on:
  push:
    branches: [master]
    paths-ignore:
      - 'docs/**'
      - 'go-vod/**'
      - 'android/**'
      - 'mkdocs.yml'
      - '**.md'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'go-vod/**'
      - 'android/**'
      - 'mkdocs.yml'
      - '**.md'

env:
  APP_NAME: memories
  PHP_CLI_SERVER_WORKERS: 12

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  vue:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the app
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Build vue app
        run: |
          make js-init
          make build-js-production
          ./scripts/verify-js-manifest.ts
          zip -r vue.zip js/

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vue.zip
          path: vue.zip

  e2e:
    runs-on: ubuntu-latest
    needs: vue

    strategy:
      fail-fast: false
      matrix:
        databases: ${{ fromJSON(github.event_name == 'pull_request' && '["mysql","pgsql"]' || '["mysql","mariadb","pgsql","sqlite"]') }}
        php-versions: ['8.4']
        server-versions: ${{ fromJSON(github.event_name == 'pull_request' && '["stable35"]' || '["stable34","stable35"]') }}

    services:
      mysql:
        image: ${{ matrix.databases == 'mysql' && 'mysql:lts' || '' }}
        ports:
          - 4444:3306/tcp
        env:
          MYSQL_DATABASE: nextcloud
          MYSQL_USER: db_user
          MYSQL_PASSWORD: db_password
          MYSQL_ROOT_PASSWORD: db_password
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval 5s
          --health-timeout 2s
          --health-retries 5
        command: >-
          --local-infile=1
          --log_bin_trust_function_creators=true

      mariadb:
        image: ${{ matrix.databases == 'mariadb' && 'mariadb:lts' || '' }}
        ports:
          - 4444:3306/tcp
        env:
          MYSQL_DATABASE: nextcloud
          MYSQL_USER: db_user
          MYSQL_PASSWORD: db_password
          MYSQL_ROOT_PASSWORD: root_password
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s
          --health-timeout 2s
          --health-retries 5

      postgres:
        image: ${{ matrix.databases == 'pgsql' && 'postgres:alpine' || '' }}
        ports:
          - 4444:5432/tcp
        env:
          POSTGRES_DB: nextcloud
          POSTGRES_USER: db_user
          POSTGRES_PASSWORD: db_password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:alpine
        ports:
          - 6379:6379/tcp
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Disable needrestart
        run: |
          sudo mkdir -p /etc/needrestart/conf.d
          echo '$nrconf{restart} = "l";' | sudo tee /etc/needrestart/conf.d/ci.conf

      - name: Checkout server
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          repository: nextcloud/server
          ref: ${{ matrix.server-versions }}

      - name: Checkout the app
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: apps/${{ env.APP_NAME }}

      - parallel:
        - name: Download WebUI bundle
          uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
          with:
            name: vue.zip

        - name: Checkout Nextcloud Photos app
          uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
          with:
            path: apps/photos
            repository: nextcloud/photos
            ref: ${{ matrix.server-versions }}

        - name: Checkout Nextcloud Viewer app
          uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
          with:
            path: apps/viewer
            repository: nextcloud/viewer
            ref: ${{ matrix.server-versions }}

        - name: Use Node.js
          uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
          with:
            node-version-file: apps/${{ env.APP_NAME }}/.nvmrc
            cache: npm
            cache-dependency-path: apps/${{ env.APP_NAME }}/package-lock.json

      - name: Set up php ${{ matrix.php-versions }}
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ matrix.php-versions }}
          tools: phpunit
          extensions: mbstring, iconv, fileinfo, intl, mysql, pdo_mysql
          coverage: none
          ini-values: >-
            opcache.enable_cli=1,
            opcache.jit=tracing,
            opcache.jit_buffer_size=64M

      - name: Get Composer cache directory
        id: composer-cache
        working-directory: apps/memories
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-e2e-${{ hashFiles('apps/photos/composer.lock', 'apps/viewer/composer.lock') }}
          restore-keys: composer-e2e-

      - name: Run tests
        env:
          NC_DB_TYPE: ${{ matrix.databases }}
          NC_DB_USER: ${{ matrix.databases == 'mysql' && 'root' || 'db_user' }}
          NC_DB_PASS: db_password
          PHP_VERSION: ${{ matrix.php-versions }}
          NC_VERSION: ${{ matrix.server-versions }}
          NC_DB_PORT: 4444
          NC_REDIS_PORT: 6379
          E2E_VIDEO: ${{ github.event_name == 'push' && '1' || '0' }}
        run: |
          make -C apps/${{ env.APP_NAME }} e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() && (github.event_name != 'pull_request' || failure()) }}
        with:
          name: report-${{ matrix.databases }}-${{ matrix.php-versions }}-${{ matrix.server-versions }}
          path: apps/${{ env.APP_NAME }}/playwright-report
          retention-days: 15
