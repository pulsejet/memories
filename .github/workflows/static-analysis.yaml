---
name: static analysis
on:
  push:
    branches: [master, development]
    paths-ignore:
      - 'docs/**'
      - 'go-vod/**'
      - 'android/**'
      - 'mkdocs.yml'
      - '**.md'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'go-vod/**'
      - 'android/**'
      - 'mkdocs.yml'
      - '**.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  php-lint:
    name: PHP Lint
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php-versions: ['8.4']
        server-versions: ['stable34', 'stable35']

    steps:
      - name: Checkout server
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          repository: nextcloud/server
          ref: ${{ matrix.server-versions }}

      - name: Checkout the app
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: apps/memories

      - name: Set up php ${{ matrix.php-versions }}
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ matrix.php-versions }}

      - name: Get Composer cache directory
        id: composer-cache
        working-directory: apps/memories
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ hashFiles('apps/memories/composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies
        working-directory: apps/memories
        run: |
          make php-init

      - name: Run PHP-CS-Fixer
        if: ${{ ! cancelled() }}
        working-directory: apps/memories
        run: |
          vendor/bin/php-cs-fixer fix --dry-run --diff

      - name: Run Psalm
        if: ${{ ! cancelled() }}
        working-directory: apps/memories
        run: |
          vendor/bin/psalm --no-cache --shepherd --stats --threads=max lib

  vue-lint:
    name: Vue Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the app
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run vue-tsc
        run: make js-lint

      - name: Run Prettier
        run: make format-check
