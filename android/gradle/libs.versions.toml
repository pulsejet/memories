[versions]
compileSdk = "37"
compileSdkMinor = "2"
minSdk = "31"
#noinspection OldTargetApi: 37 needs ACCESS_LOCAL_NETWORK handling (#1789)
targetSdk = "36"
java = "21"

agp = "9.5.0"
kotlin = "2.4.21"
ksp = "2.3.13"
media3 = "1.11.1"
room = "2.8.5"
ktor = "3.6.1"
coroutines = "1.11.0"
exifinterface = "1.4.2"

[libraries]
androidx-core-ktx = "androidx.core:core-ktx:1.19.1"
androidx-appcompat = "androidx.appcompat:appcompat:1.8.0"
androidx-annotation = "androidx.annotation:annotation:1.11.0"
androidx-exifinterface = { module = "androidx.exifinterface:exifinterface", version.ref = "exifinterface" }
androidx-browser = "androidx.browser:browser:1.10.0"
androidx-webkit = "androidx.webkit:webkit:1.18.0"
material = "com.google.android.material:material:1.14.0"

media3-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "media3" }
media3-exoplayer-hls = { module = "androidx.media3:media3-exoplayer-hls", version.ref = "media3" }
media3-ui = { module = "androidx.media3:media3-ui", version.ref = "media3" }

room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }

okhttp = "com.squareup.okhttp3:okhttp:5.5.1"
kotlinx-html = "org.jetbrains.kotlinx:kotlinx-html-jvm:0.12.0"
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
versioncompare = "io.github.g00fy2:versioncompare:1.5.0"
ktor-server-core = { module = "io.ktor:ktor-server-core", version.ref = "ktor" }
ktor-server-cio = { module = "io.ktor:ktor-server-cio", version.ref = "ktor" }
bouncycastle = "org.bouncycastle:bcprov-jdk18on:1.86"

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
