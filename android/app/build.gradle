android {
    namespace = "gallery.memories"
    compileSdk = libs.versions.compileSdk.get().toInteger()
    compileSdkMinor = libs.versions.compileSdkMinor.get().toInteger()

    buildFeatures {
        buildConfig = true
        viewBinding = true
    }

    defaultConfig {
        applicationId = "gallery.memories"
        minSdk = libs.versions.minSdk.get().toInteger()
        targetSdk = libs.versions.targetSdk.get().toInteger()
        versionCode = 19
        versionName = "1.19"
    }

    signingConfigs {
        debug {
            storeFile = file("debug.keystore")
            storeType = "pkcs12"
            storePassword = "android"
            keyAlias = "androiddebugkey"
            keyPassword = "android"
        }
    }

    buildTypes {
        debug {
            signingConfig = signingConfigs.debug
        }
        release {
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility = JavaVersion.toVersion(libs.versions.java.get())
        targetCompatibility = JavaVersion.toVersion(libs.versions.java.get())
    }
    dependenciesInfo {
        // Keep the encrypted dependency block out of APKs (F-Droid / GitHub); AABs keep it for Play.
        includeInApk = false
    }
    lint {
        // A gallery needs the full library; this check ignores tools:ignore.
        disable += "SelectedPhotoAccess"
    }
}

