plugins {
    id 'com.android.application'
    id 'com.google.devtools.ksp' version '2.3.12'
}

android {
    namespace = "gallery.memories"
    compileSdk = 37
    compileSdkMinor = 2

    buildFeatures {
        buildConfig = true
        viewBinding = true
    }

    defaultConfig {
        applicationId = "gallery.memories"
        minSdk = 31
        targetSdk = 36
        versionCode = 15
        versionName = "1.15"
    }

    buildTypes {
        release {
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }
}

kotlin {
    jvmToolchain(21)
}

dependencies {
    def media_version = "1.11.1"
    def room_version = "2.8.5"
    def ktor_version = "3.6.0"
    def coroutines_version = "1.11.0"

    implementation 'androidx.core:core-ktx:1.19.1'
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'
    implementation 'androidx.navigation:navigation-fragment-ktx:2.10.2'
    implementation 'androidx.navigation:navigation-ui-ktx:2.10.2'

    implementation 'androidx.exifinterface:exifinterface:1.4.2'
    implementation 'androidx.browser:browser:1.10.0'
    implementation 'androidx.webkit:webkit:1.18.0'
    implementation "androidx.media3:media3-exoplayer:$media_version"
    implementation "androidx.media3:media3-ui:$media_version"
    implementation "androidx.media3:media3-exoplayer-hls:$media_version"

    implementation "androidx.room:room-runtime:$room_version"
    ksp "androidx.room:room-compiler:$room_version"

    implementation "com.squareup.okhttp3:okhttp:5.5.1"
    implementation "org.jetbrains.kotlinx:kotlinx-html-jvm:0.12.0"
    implementation "io.github.g00fy2:versioncompare:1.5.0"

    implementation "io.ktor:ktor-server-core:$ktor_version"
    implementation "io.ktor:ktor-server-cio:$ktor_version"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:$coroutines_version"

    implementation 'org.bouncycastle:bcprov-jdk18on:1.86'
}
